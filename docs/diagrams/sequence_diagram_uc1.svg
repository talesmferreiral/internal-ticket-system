<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" width="1100" height="720" font-family="Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 1L9 5L0 9" fill="#1e3a5f" stroke="none"/>
    </marker>
    <marker id="arr-dash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 1L9 5L0 9" fill="#555" stroke="none"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 1L9 5L0 9" fill="#dc2626" stroke="none"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1100" height="720" fill="#f5f5f3" rx="10"/>

  <!-- Title bar -->
  <rect x="16" y="10" width="1068" height="46" rx="6" fill="#1e3a5f"/>
  <text x="550" y="29" text-anchor="middle" font-size="14" font-weight="bold" fill="#fff">Diagrama de Sequência — UC1: Abrir Solicitação / Chamado Interno</text>
  <text x="550" y="47" text-anchor="middle" font-size="10" fill="#93c5fd">Sistema de Gestão de Chamados Internos · TechCorp Solutions · UML Sequence Diagram</text>

  <!-- ── LIFELINE HEADERS ── -->
  <!-- Colaborador x=110 -->
  <rect x="50" y="68" width="120" height="46" rx="6" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="110" y="87" text-anchor="middle" font-size="11" font-weight="bold" fill="#14532d">Colaborador</text>
  <text x="110" y="103" text-anchor="middle" font-size="9" fill="#555">:Colaborador</text>

  <!-- Interface x=280 -->
  <rect x="220" y="68" width="120" height="46" rx="6" fill="#dbeafe" stroke="#1d4ed8" stroke-width="2"/>
  <text x="280" y="87" text-anchor="middle" font-size="11" font-weight="bold" fill="#1e3a80">Interface</text>
  <text x="280" y="103" text-anchor="middle" font-size="9" fill="#555">:SistemaChamados</text>

  <!-- Controller x=470 -->
  <rect x="410" y="68" width="120" height="46" rx="6" fill="#faf5ff" stroke="#7c3aed" stroke-width="2"/>
  <text x="470" y="87" text-anchor="middle" font-size="11" font-weight="bold" fill="#4c1d95">Controlador</text>
  <text x="470" y="103" text-anchor="middle" font-size="9" fill="#555">:ChamadoController</text>

  <!-- Chamado x=660 -->
  <rect x="600" y="68" width="120" height="46" rx="6" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="660" y="87" text-anchor="middle" font-size="11" font-weight="bold" fill="#78350f">Chamado</text>
  <text x="660" y="103" text-anchor="middle" font-size="9" fill="#555">:Chamado</text>

  <!-- Notificacao x=870 -->
  <rect x="810" y="68" width="120" height="46" rx="6" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="870" y="87" text-anchor="middle" font-size="11" font-weight="bold" fill="#7f1d1d">Notificação</text>
  <text x="870" y="103" text-anchor="middle" font-size="9" fill="#555">:Notificacao</text>

  <!-- ── LIFELINES ── -->
  <line x1="110" y1="114" x2="110" y2="700" stroke="#16a34a" stroke-width="1.2" stroke-dasharray="7,4" opacity="0.6"/>
  <line x1="280" y1="114" x2="280" y2="700" stroke="#1d4ed8" stroke-width="1.2" stroke-dasharray="7,4" opacity="0.6"/>
  <line x1="470" y1="114" x2="470" y2="700" stroke="#7c3aed" stroke-width="1.2" stroke-dasharray="7,4" opacity="0.6"/>
  <line x1="660" y1="114" x2="660" y2="700" stroke="#b45309" stroke-width="1.2" stroke-dasharray="7,4" opacity="0.6"/>
  <line x1="870" y1="114" x2="870" y2="700" stroke="#dc2626" stroke-width="1.2" stroke-dasharray="7,4" opacity="0.6"/>

  <!-- ── ACTIVATION BOXES ── -->
  <rect x="105" y="145" width="10" height="490" fill="#16a34a" opacity="0.25" rx="2"/>
  <rect x="275" y="165" width="10" height="420" fill="#1d4ed8" opacity="0.25" rx="2"/>
  <rect x="465" y="205" width="10" height="330" fill="#7c3aed" opacity="0.25" rx="2"/>
  <rect x="655" y="255" width="10" height="180" fill="#b45309" opacity="0.25" rx="2"/>
  <rect x="865" y="435" width="10" height="80" fill="#dc2626" opacity="0.25" rx="2"/>

  <!-- ── STEP NUMBERS (left) ── -->
  <text x="28" y="162" font-size="9" fill="#999" font-weight="bold">1</text>
  <text x="28" y="202" font-size="9" fill="#999" font-weight="bold">2</text>
  <text x="28" y="242" font-size="9" fill="#999" font-weight="bold">3</text>
  <text x="28" y="282" font-size="9" fill="#999" font-weight="bold">4</text>
  <text x="28" y="362" font-size="9" fill="#999" font-weight="bold">5</text>
  <text x="28" y="402" font-size="9" fill="#999" font-weight="bold">6</text>
  <text x="28" y="442" font-size="9" fill="#999" font-weight="bold">7</text>
  <text x="28" y="482" font-size="9" fill="#999" font-weight="bold">8</text>
  <text x="28" y="522" font-size="9" fill="#999" font-weight="bold">9</text>
  <text x="28" y="562" font-size="9" fill="#999" font-weight="bold">10</text>

  <!-- ── MESSAGES ── -->

  <!-- 1: Colaborador → Interface: acessarSistema() -->
  <line x1="115" y1="157" x2="274" y2="157" stroke="#1e3a5f" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="194" y="151" text-anchor="middle" font-size="10" fill="#1e3a5f" font-weight="bold">acessarSistema()</text>

  <!-- 2: Interface → Colaborador: exibirFormulario() return -->
  <line x1="275" y1="197" x2="116" y2="197" stroke="#555" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arr-dash)"/>
  <text x="194" y="191" text-anchor="middle" font-size="10" fill="#555">exibirFormulario()</text>

  <!-- 3: Colaborador → Interface: preencherFormulario(dados) -->
  <line x1="115" y1="237" x2="274" y2="237" stroke="#1e3a5f" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="194" y="231" text-anchor="middle" font-size="10" fill="#1e3a5f" font-weight="bold">preencherFormulario(dados)</text>

  <!-- 4: Interface → Controller: validarDados(dados) -->
  <line x1="285" y1="277" x2="464" y2="277" stroke="#1e3a5f" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="374" y="271" text-anchor="middle" font-size="10" fill="#1e3a5f" font-weight="bold">validarDados(dados)</text>

  <!-- ALT fragment -->
  <rect x="44" y="292" width="1028" height="210" rx="4" fill="none" stroke="#777" stroke-width="1.4"/>
  <rect x="44" y="292" width="36" height="18" rx="2" fill="#777"/>
  <text x="62" y="305" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff">alt</text>
  <!-- alt label valid -->
  <text x="550" y="308" text-anchor="middle" font-size="9" fill="#14532d" font-style="italic">[dados válidos]</text>
  <!-- divider -->
  <line x1="44" y1="370" x2="1072" y2="370" stroke="#777" stroke-width="0.8" stroke-dasharray="5,3"/>
  <!-- alt label invalid -->
  <text x="550" y="385" text-anchor="middle" font-size="9" fill="#dc2626" font-style="italic">[dados inválidos]</text>

  <!-- 5: Controller → Chamado: criarChamado(dados) [válido] -->
  <line x1="475" y1="322" x2="654" y2="322" stroke="#1e3a5f" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="564" y="316" text-anchor="middle" font-size="10" fill="#1e3a5f" font-weight="bold">criarChamado(dados)</text>

  <!-- 6: Chamado → Chamado: gerarProtocolo() self-call -->
  <path d="M660 342 Q700 342 700 352 Q700 362 660 362" fill="none" stroke="#b45309" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="720" y="356" font-size="10" fill="#b45309">gerarProtocolo()</text>

  <!-- return from Chamado to Controller -->
  <line x1="655" y1="380" x2="476" y2="380" stroke="#555" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arr-dash)"/>
  <text x="564" y="374" text-anchor="middle" font-size="10" fill="#555">retornarProtocolo()</text>

  <!-- invalid: Controller → Interface: exibirErro() -->
  <line x1="465" y1="400" x2="286" y2="400" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arr-red)"/>
  <text x="374" y="394" text-anchor="middle" font-size="10" fill="#dc2626">exibirErro(mensagem)</text>

  <!-- end alt -->

  <!-- 7: Controller → Notificacao: enviar(protocolo) -->
  <line x1="475" y1="437" x2="864" y2="437" stroke="#1e3a5f" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="668" y="431" text-anchor="middle" font-size="10" fill="#1e3a5f" font-weight="bold">enviar(protocolo, colaborador)</text>

  <!-- 8: Notificacao return -->
  <line x1="865" y1="477" x2="476" y2="477" stroke="#555" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arr-dash)"/>
  <text x="668" y="471" text-anchor="middle" font-size="10" fill="#555">notificacaoEnviada()</text>

  <!-- 9: Controller → Interface: confirmarAbertura(protocolo) -->
  <line x1="465" y1="517" x2="286" y2="517" stroke="#555" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arr-dash)"/>
  <text x="374" y="511" text-anchor="middle" font-size="10" fill="#555">confirmarAbertura(protocolo)</text>

  <!-- 10: Interface → Colaborador: exibirConfirmacao() -->
  <line x1="275" y1="557" x2="116" y2="557" stroke="#555" stroke-width="1.4" stroke-dasharray="5,3" marker-end="url(#arr-dash)"/>
  <text x="194" y="551" text-anchor="middle" font-size="10" fill="#555">exibirConfirmacao(protocolo)</text>

  <!-- ── LEGEND ── -->
  <rect x="44" y="622" width="500" height="68" rx="6" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <text x="58" y="641" font-size="10" font-weight="bold" fill="#1e3a5f">Legenda</text>
  <!-- sync -->
  <line x1="58" y1="658" x2="120" y2="658" stroke="#1e3a5f" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="130" y="662" font-size="9" fill="#333">Mensagem síncrona</text>
  <!-- return -->
  <line x1="58" y1="676" x2="120" y2="676" stroke="#555" stroke-width="1.4" stroke-dasharray="5,2" marker-end="url(#arr-dash)"/>
  <text x="130" y="680" font-size="9" fill="#333">Mensagem de retorno</text>
  <!-- error -->
  <line x1="250" y1="658" x2="312" y2="658" stroke="#dc2626" stroke-width="1.4" stroke-dasharray="5,2" marker-end="url(#arr-red)"/>
  <text x="322" y="662" font-size="9" fill="#dc2626">Fluxo de exceção</text>
  <!-- self -->
  <path d="M262 672 Q282 672 282 678 Q282 684 262 684" fill="none" stroke="#b45309" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="295" y="681" font-size="9" fill="#b45309">Autochamada</text>

  <!-- alt box legend -->
  <rect x="580" y="622" width="490" height="68" rx="6" fill="#fff" stroke="#ccc" stroke-width="1"/>
  <rect x="594" y="632" width="36" height="16" rx="2" fill="#777"/>
  <text x="612" y="644" text-anchor="middle" font-size="9" font-weight="bold" fill="#fff">alt</text>
  <text x="650" y="644" font-size="9" fill="#333">Fragmento combinado — fluxo alternativo (válido / inválido)</text>
  <rect x="594" y="654" width="10" height="26" fill="#16a34a" opacity="0.3" rx="2"/>
  <text x="614" y="671" font-size="9" fill="#333">Caixa de ativação — objeto processando mensagem</text>

</svg>
